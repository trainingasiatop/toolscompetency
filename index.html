<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Competency Assessment · AsiaGroup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* TNA 2027 · bahasa visual mengikuti Learning Center Asiatop */
:root{
  --bg:#FFFFFF;--bg-2:#F4F8FF;--bg-3:#EAF1FF;--ink:#0B1B3F;--ink-2:#2A3B62;--muted:#5B6B8E;--line:#DFE7F5;--line-2:#C9D6EE;
  --blue:#1F5BFF;--blue-2:#1747D1;--blue-soft:#E8EFFF;--sky:#62B6FF;
  --red:#E23B3B;--red-2:#C42727;--red-soft:#FFECEC;
  --yellow:#FFC83D;--yellow-ink:#4A3600;--yellow-soft:#FFF6DA;
  --good:#15924A;--good-soft:#E3F6EA;--warn:#B87200;--warn-soft:#FFF2D9;--bad:#D12E2E;--bad-soft:#FFE9E9;
  --orange:#A14508;--orange-soft:#FFEEDD;--teal:#086A70;--teal-soft:#DFF5F6;--plum:#A3246E;--plum-soft:#FBE6F3;--slate:#4A5F86;--slate-soft:#E9EEF7;
  --shadow-sm:0 1px 2px rgba(15,40,100,.06),0 4px 12px -6px rgba(15,40,100,.12);
  --shadow:0 1px 2px rgba(15,40,100,.06),0 12px 32px -12px rgba(15,40,100,.22);
  --f:"Plus Jakarta Sans",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-sm:10px;--r:16px;--r-lg:24px;--nav-h:64px;
  --gut:max(16px,env(safe-area-inset-left,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg-2);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;font-weight:800;letter-spacing:-.01em}
p{margin:0}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1200px;margin:0 auto;padding-left:var(--gut);padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.narrow{max-width:760px}
.wrap.mid{max-width:980px}
.tnum{font-variant-numeric:tabular-nums}
svg.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- nav ---------- */
.topnav{position:sticky;top:0;z-index:60;padding-top:env(safe-area-inset-top,0px);background:rgba(255,255,255,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.topnav>.wrap{height:var(--nav-h);display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--ink);font-size:15px;white-space:nowrap;background:none;border:0;padding:4px;border-radius:10px}
.brand img{height:24px;width:auto}
.brand .bdiv{width:1px;height:22px;background:var(--line-2)}
.brand small{font-weight:600;color:var(--muted);font-size:12px;display:block;line-height:1.1}
.navlinks{display:flex;gap:2px;margin-left:auto;margin-right:auto;align-items:center}
.navlinks button{padding:8px 13px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink-2);border:0;background:none;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.navlinks button:hover{background:var(--bg-3)}
.navlinks button.on{background:var(--ink);color:#fff}
.navlinks .n{font-family:var(--f-mono);font-size:11px;font-weight:700;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:var(--bg-3);color:var(--ink-2)}
.navlinks .on .n{background:rgba(255,255,255,.2);color:#fff}
.navlinks .n.ok{background:var(--good);color:#fff}
.nav-right{display:flex;gap:8px;align-items:center;margin-left:auto}
.navlinks + .nav-right{margin-left:0}
.nav-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg-2);border:1px solid var(--line);color:var(--ink-2);flex:none}
.nav-ico:hover{background:var(--bg-3)}
.saved{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.saved.mem i{background:#E49B00}
.page{min-height:calc(100vh - var(--nav-h));padding-bottom:56px}
.page.bare{padding-top:0;padding-bottom:0}
.botnav{display:none}
@media (max-width:860px){
  .navlinks{display:none}
  .nav-right{margin-left:auto}
  .saved span{display:none}
  .nav-ico{width:36px;height:36px}
  .botnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .botnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--muted);border:0;background:none;padding:5px 0;min-height:46px;border-radius:10px}
  .botnav button svg{width:22px;height:22px}
  .botnav button.on{color:var(--blue)}
  body.has-bot{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  body.has-bot .page{padding-bottom:24px}
}

/* ---------- tombol, chip, isian ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14px;border:1px solid transparent;background:var(--bg-3);color:var(--ink);transition:background .15s,transform .1s,box-shadow .15s;min-height:44px;text-align:center;line-height:1.25}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 8px 18px -10px var(--blue)}
.btn.primary:hover{background:var(--blue-2)}
.btn.soft{background:var(--blue-soft);color:var(--blue-2)}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--bg-2)}
.btn.yellow{background:var(--yellow);color:var(--yellow-ink);box-shadow:0 8px 18px -10px #D99A00}
.btn.yellow:hover{background:#FFD35F}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.dark{background:var(--ink);color:#fff}
.btn.link{background:none;color:var(--blue-2);padding:8px 10px;min-height:40px}
.btn.link:hover{background:var(--blue-soft)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px;min-height:36px}
.btn.lg{padding:15px 26px;font-size:16px;border-radius:14px;min-height:54px}
.btn.icon{width:44px;padding:0}
.btn.icon.sm{width:36px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--bg-3);color:var(--ink-2);white-space:nowrap;line-height:1.4}
.chip svg.ic{width:13px;height:13px;stroke-width:2.6}
.chip.blue{background:var(--blue-soft);color:var(--blue-2)}
.chip.yellow{background:var(--yellow-soft);color:#8A5600}
.chip.orange{background:var(--orange-soft);color:var(--orange)}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
.chip.good{background:var(--good-soft);color:#0E7038}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:#8A5600}
.chip.slate{background:var(--slate-soft);color:var(--slate)}
.chip.plum{background:var(--plum-soft);color:var(--plum)}
.chip.dark{background:var(--ink);color:#fff}
.chip.wrap-ok{white-space:normal}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.row.tight{gap:6px}
.row.nowrap{flex-wrap:nowrap}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.lg{gap:20px}
.grow{flex:1;min-width:0}
.input,.select,.textarea{border:1.5px solid var(--line-2);background:#fff;border-radius:12px;padding:11px 13px;font-size:15px;width:100%;min-width:0;min-height:46px;transition:border-color .15s,box-shadow .15s}
.textarea{min-height:84px;resize:vertical;line-height:1.5}
.input:focus,.select:focus,.textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,91,255,.14)}
.input::placeholder,.textarea::placeholder{color:#7C8BAB}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:13px;font-weight:700}
.hint{font-size:12.5px;color:var(--muted)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card.pad{padding:22px}
@media (max-width:560px){.card.pad{padding:16px}}

/* pilihan besar (pilih, jangan ketik) */
.opts{display:grid;gap:10px}
.opts.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.opts.c3{grid-template-columns:minmax(0,1fr)}.opts.c3.keep{grid-template-columns:repeat(3,minmax(0,1fr))}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;min-height:60px;font-weight:700;font-size:15px;transition:border-color .15s,background .15s,transform .1s,box-shadow .15s;position:relative;line-height:1.3;width:100%}
.opt:hover{border-color:var(--line-2);background:var(--bg-2)}
.opt:active{transform:translateY(1px)}
.opt .oi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--bg-3);color:var(--ink-2);flex:none}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px}
.opt kbd{margin-left:auto;font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;background:var(--bg-2)}
@media (hover:none),(max-width:860px){.opt kbd{display:none}}
.opt[aria-pressed="true"]{border-color:var(--c,var(--blue));background:var(--cs,var(--blue-soft));box-shadow:0 8px 18px -14px var(--c,var(--blue))}
.opt[aria-pressed="true"] .oi{background:var(--c,var(--blue));color:#fff}
.opt.good{--c:var(--good);--cs:var(--good-soft)}
.opt.warn{--c:#D58A00;--cs:var(--warn-soft)}
.opt.bad{--c:var(--bad);--cs:var(--bad-soft)}
.opt.slate{--c:var(--slate);--cs:var(--slate-soft)}
.opt.orange{--c:var(--orange);--cs:var(--orange-soft)}
.opt.blue{--c:var(--blue);--cs:var(--blue-soft)}
.opt.compact{min-height:52px;padding:10px 12px;justify-content:center;text-align:center;flex-direction:column;gap:2px}
.opt .tag-s{position:absolute;top:-9px;right:10px;font-size:10.5px;font-weight:800;background:var(--ink);color:#fff;border-radius:999px;padding:2px 8px;letter-spacing:.02em}
.tile{flex-direction:column;align-items:flex-start;gap:8px;padding:16px;min-height:150px}
.tile .oi{width:44px;height:44px;border-radius:14px}
.tile .pct{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--c)}
.tile b{font-size:16.5px}
.tile .to{font-size:11.5px;font-weight:700;color:var(--muted);margin-top:auto}
@media (max-width:640px){.tile{flex-direction:row;align-items:center;min-height:0;padding:12px 14px}.tile .to{display:none}}
.pick{border:1.5px solid var(--line-2);background:#fff;border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;min-height:44px;text-align:left;line-height:1.3;display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s}
.pick:hover{background:var(--bg-2)}
.pick[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pick.sug{border-style:dashed;border-color:#9DB2DB;background:var(--bg-2);border-radius:14px}
.pick.sug:hover{border-color:var(--blue);background:var(--blue-soft)}
.pick.sug[aria-pressed="true"]{border-style:solid;background:var(--blue-soft);border-color:var(--blue);color:var(--blue-2)}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.q{display:flex;flex-direction:column;gap:10px;animation:rise .25s ease-out}
.q>.qh{display:flex;align-items:center;gap:8px;justify-content:space-between}
.q>.qh h3,.q>.qh label{font-size:16px;font-weight:800;letter-spacing:-.01em}
.q .sub{font-size:13px;color:var(--muted);margin-top:-6px}
.exbtn{border:0;background:none;color:var(--blue-2);font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:4px;padding:6px 8px;border-radius:8px;min-height:36px;white-space:nowrap}
.exbtn:hover{background:var(--blue-soft)}
.exbtn svg.ic{width:15px;height:15px}
.withsug{position:relative}
.sugnote{font-size:12px;font-weight:700;color:#8A5600;background:var(--yellow-soft);border-radius:999px;padding:2px 9px;display:inline-flex;align-items:center;gap:5px}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
details.fold{border:1px dashed var(--line-2);border-radius:14px;background:var(--bg-2)}
details.fold>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;min-height:46px;border-radius:14px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"";width:8px;height:8px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-right:2px}
details.fold[open]>summary::before{transform:rotate(45deg)}
details.fold>.fb{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px}

/* ---------- sambutan ---------- */
.hero{position:relative;min-height:min(74vh,640px);overflow:hidden;color:#fff;isolation:isolate;background:#2563E0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:calc(34px + env(safe-area-inset-top,0px)) 16px 150px}
.hero.small{min-height:0;padding-bottom:150px}
.hero-scene{position:absolute;inset:0;z-index:-1}
.hero-scene svg{position:absolute;inset:0;width:100%;height:100%}
.cloud-drift{animation:drift 80s linear infinite alternate}
.sunrays{transform-origin:1290px 150px;animation:spin 70s linear infinite}
@keyframes drift{to{transform:translateX(60px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.logos{display:inline-flex;align-items:center;gap:14px;background:rgba(255,255,255,.94);border-radius:999px;padding:9px 20px;box-shadow:0 12px 30px -14px rgba(10,40,120,.6)}
.logos img{height:24px;width:auto}
.logos i{width:1px;height:20px;background:var(--line-2)}
@media (max-width:480px){.logos{gap:9px;padding:7px 14px}.logos img{height:17px}}
.hero-title{font-size:clamp(46px,9vw,112px);line-height:.9;letter-spacing:-.045em;font-weight:800;text-shadow:0 6px 30px rgba(10,50,140,.35);margin:18px 0 0}
.hero-title .l1{display:block;font-size:.4em;letter-spacing:-.02em;color:#EAF4FF;line-height:1.15;margin-bottom:.12em}
.hero-desc{font-size:clamp(15px,1.5vw,18px);max-width:56ch;color:#F2F8FF;font-weight:500;text-shadow:0 2px 14px rgba(10,50,140,.45);margin-top:14px}
.mascot-spot{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:flex-start;gap:6px;z-index:2}
.mascot{width:104px;filter:drop-shadow(0 14px 14px rgba(20,60,30,.28));animation:bob 3.2s ease-in-out infinite}
.mascot svg{width:100%;height:auto;display:block;overflow:visible}
@keyframes bob{50%{transform:translateY(-7px)}}
.bubble{background:#0B1B3F;color:#fff;font-size:13.5px;font-weight:700;padding:9px 14px;border-radius:14px;position:relative;margin-top:22px;white-space:nowrap;box-shadow:0 14px 30px -14px rgba(0,0,0,.6)}
.bubble::after{content:"";position:absolute;left:-5px;top:50%;width:12px;height:12px;background:#0B1B3F;transform:translateY(-50%) rotate(45deg);border-radius:2px}
.doors{margin-top:-64px;position:relative;z-index:3;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.doors{grid-template-columns:minmax(0,1fr)}}
.entry{position:relative;overflow:hidden;border-radius:28px;padding:26px;min-height:220px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;text-align:left;border:0;color:#fff;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;width:100%}
.entry:hover{transform:translateY(-5px)}
.entry .tag{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.92;position:relative}
.entry h3{font-size:clamp(22px,2.4vw,28px);letter-spacing:-.02em;max-width:17ch;position:relative}
.entry p{font-size:14px;opacity:.94;max-width:40ch;position:relative}
.entry .go{position:absolute;right:20px;top:20px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;transition:transform .3s}
.entry:hover .go{transform:rotate(45deg) scale(1.08)}
.entry .art{position:absolute;inset:0;pointer-events:none;opacity:.3}
.entry .art svg{width:100%;height:100%}
.entry.blue{background:linear-gradient(135deg,#1F5BFF,#3E8BFF 65%,#62B6FF);box-shadow:0 24px 44px -22px rgba(31,91,255,.8)}
.entry.red{background:linear-gradient(135deg,#B91F1F,#E23B3B 60%,#FF7262);box-shadow:0 24px 44px -22px rgba(226,59,59,.8)}
.entry .estat{display:flex;gap:8px;margin-top:6px;position:relative;font-size:12.5px;font-weight:700;flex-wrap:wrap}
.entry .estat span{background:rgba(255,255,255,.22);padding:4px 10px;border-radius:999px}
.widecard{grid-column:1/-1;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:28px;padding:24px 26px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;box-shadow:0 24px 44px -26px rgba(23,71,209,.45);position:relative;overflow:hidden}
.widecard .tag{font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--warn)}
.widecard h3{font-size:22px;letter-spacing:-.02em}
.widecard p{color:var(--muted);font-size:14px;max-width:52ch}
.widecard::before{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:var(--yellow-soft);z-index:0}
.widecard>*{position:relative;z-index:1}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:26px 16px 30px}

/* ---------- spanduk ---------- */
.banner{background:var(--yellow);color:var(--yellow-ink);font-weight:700;font-size:13.5px;padding:8px 0}
.banner .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner b{font-weight:800;letter-spacing:.04em}
.banner .btn{min-height:34px;padding:5px 12px;font-size:12.5px;background:rgba(74,54,0,.12);color:var(--yellow-ink)}
.banner .btn:hover{background:rgba(74,54,0,.2)}
.banner.mem{background:var(--warn-soft);color:#6B4300;border-bottom:1px solid #F1D9A6}

/* ---------- stepper ---------- */
.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 6px}
.step{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:9px 12px;text-align:left;min-height:52px;position:relative}
.step .sn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--bg-3);color:var(--ink-2);flex:none;font-family:var(--f-mono)}
.step b{display:block;font-size:13.5px;line-height:1.2}
.step small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.3}
.step.on{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,91,255,.12)}
.step.on .sn{background:var(--blue);color:#fff}
.step.done .sn{background:var(--good);color:#fff}

ork & Collaboration", "jenis": "Core", "def": "Kemampuan untuk dapat bekerja secara efektif dan kooperatif dengan orang lain untuk mencapai tujuan bersama, membangun hubungan yang harmonis, dan memastikan setiap anggota tim dapat berkontribusi secara maksimal.", "label": "Kurang mau bekerja sama dengan tim lain", "matrix": [2, 3, 4, 4, 5, 5], "lv": [{"lv": 1, "nama": "Awareness", "head": "Bekerja Sama Ketika Diarahkan", "dev": [["70", "Pemberian tugas tim yang jelas dengan ekspektasi kolaborasi yang terukur."], ["20", "Coaching dari atasan tentang pentingnya kerja tim dan kontribusi kepada tim."], ["20", "OJT bersama senior yang menunjukkan contoh kolaborasi yang baik."]], "kb": ["Akan bekerja sama jika diminta, namun belum secara proaktif menunjukkan inisiatif untuk berkolaborasi.", "Mengikuti instruksi dan menyelesaikan tugas-tugas yang diberikan sebagai anggota tim.", "Fokus terhadap tugas dan tanggung jawab personal tanpa banyak memperhatikan kebutuhan tim.", "Cenderung tidak secara aktif berkontribusi dalam memberikan ide di luar area tanggung jawabnya."]}, {"lv": 2, "nama": "Basic", "head": "Mendukung Tim Secara Aktif", "dev": [["10", "Workshop tentang kerja tim dan manfaat kolaborasi."], ["70", "Assignment: berikan tugas yang mengharuskan koordinasi dengan minimal 2 orang lain."], ["20", "Coaching dari atasan tentang cara menawarkan bantuan yang tepat tanpa melangkahi orang lain."]], "kb": ["Secara aktif menawarkan bantuan kepada anggota tim ketika diperlukan tanpa harus diminta.", "Membantu menciptakan suasana tim yang positif, saling mendukung, dan kondusif untuk bekerja sama.", "Mengutamakan kepentingan/target tim dibandingkan dengan kepentingan atau preferensi pribadi.", "Membagikan informasi yang penting yang berkaitan langsung dengan pekerjaan untuk meningkatkan efektivitas tim."]}, {"lv": 3, "nama": "Proficient", "head": "Membangun Kolaborasi dan Hubungan Kerja yang Kuat", "dev": [["10", "Workshop terkait dengan conflict resolution dan communication in ntasikan strategi untuk meningkatkan kolaborasi di seluruh organisasi.", "Membangun sistem atau proses kerja yang mendorong adanya cross-functional teamwork untuk menghilangkan silo.", "Mampu mengatasi konflik yang kompleks di dalam organisasi untuk membangun tim yang kohesif dan berkinerja tinggi.", "Mendorong budaya kolaborasi dan inklusivitas antar departemen di dalam organisasi."]}]}, {"id": "CC0004", "code": "CSO", "nama": "Customer Service Oriented", "jenis": "Core", "def": "Keterampilan, sikap, dan perilaku individu yang dapat secara efektif memenuhi kebutuhan pelanggan, berkomitmen memberikan layanan berkualitas, membangun hubungan positif, dan konsisten meningkatkan pengalaman pelanggan.", "label": "Kurang peduli kepuasan pelanggan / user", "matrix": [2, 3, 4, 4, 5, 5], "lv": [{"lv": 1, "nama": "Awareness", "head": "Memenuhi Permintaan Customer Sesuai Prosedur", "dev": [["20", "On the job guidance: pendampingan langsung dari atasan saat menangani permintaan atau keluhan customer."], ["70", "Pemahaman SOP penanganan customer — diuji melalui roleplay sederhana."], ["10", "Basic training product knowledge agar bisa menjawab pertanyaan customer secara akurat."], ["20", "Feedback harian dari atasan setelah interaksi dengan customer."]], "kb": ["Merespons permintaan atau pertanyaan customer sesuai dengan yang disampaikan — tidak lebih, tidak kurang, sesuai prosedur.", "Meneruskan keluhan atau permintaan customer yang di luar kemampuannya kepada pihak yang berwenang tanpa menunda.", "Memberikan informasi yang diminta customer secara akurat sesuai dengan yang diketahui.", "Bersikap sopan dan tidak defensif saat menghadapi pertanyaan atau keluhan."]}, {"lv": 2, "nama": "Basic", "head": "Memastikan Kebutuhan Customer Terpenuhi", "dev": [["20", "Coaching dari atasan terkait teknik menggali kebutuhan customer (probing questions)."], ["70", "Latihan dan pembiasaan follow up: setiap kasus wajib di-follow up dalam 1x24 jam."], ["10", "Training dokumentasi dan pencatatan keluhan customer."], ["20", "Sharing session dengan senior CS: belajar dari kasus-kasus yang pernah ditangani."]], "kb": ["Memastikan permintaan atau keluhan customer benar-benar selesai dan memastikan hasilnya.", "Melakukan follow up kepada customer untuk memastikan solusi yang diberikan sudah memenuhi kebutuhannya.", "Menggali informasi tambahan dari customer sebelum memberikan solusi, agar solusi yang diberikan tepat sasaran.", "Mendokumentasikan keluhan dan penanganan customer secara tertib sesuai standar yang berlaku."]}, {"lv": 3, "nama": "Proficient", "head": "Mengidentifikasi Cara Melebihi Ekspektasi Customer", "dev": [["10", "Training conflict resolution dan customer handling — fokus pada teknik de-eskalasi."], ["70", "Penugasan sebagai first responder untuk kasus eskalasi level menengah."], ["70", "Deep dive product knowledge: memahami kecocokan produk untuk kebutuhan customer yang berbeda."], ["70", "Review bulanan KPI kepuasan customer individu bersama atasan."]], "kb": ["Mengambil tanggung jawab pribadi untuk memastikan customer puas — tidak berhenti pada selesainya prosedur.", "Proaktif menginformasikan perkembangan kepada customer tanpa harus ditanya, terutama saat ada kendala.", "Mampu meredakan situasi yang tegang dengan customer secara profesional dan mengubahnya menjadi interaksi yang konstruktif.", "Menggunakan pengetahuan produk/layanan yang dimiliki untuk memberikan solusi atau rekomendasi yang bernilai tambah."]}, {"lv": 4, "nama": "Advanced", "head": "Mengoptimalkan Proses Kerja untuk Meningkatkan Customer Experience", "dev": [["10", "Training root cause analysis dan process improvement untuk menyelesaikan masalah customer dari akar."], ["70", "Penugasan sebagai project lead perbaikan proses layanan lintas fungsi."], ["10", "Training leadership dan people development untuk membangun tim CS yang efektif."], ["20", "Benchmarking ke perusahaan atau divisi lain yang memiliki praktik customer service unggul."]], "kb": ["Mengidentifikasi kebutuhan customer yang belum disampaikan secara eksplisit dan mengambil inisiatif untuk memenuhinya.", "Menganalisis pola keluhan atau permintaan yang berulang untuk menemukan akar masalah dan memperbaiki proses secara sistemik.", "Berkoordinasi lintas fungsi untuk memastikan permasalahan customer diselesaikan dari sumbernya, bukan hanya dari permukaan.", "Bertanggung jawab atas kualitas layanan yang diberikan timnya — secara aktif mengidentifikasi gap dan mendorong improvement."]}, {"lv": 5, "nama": "Expert", "head": "Membangun Budaya Customer-Centric Organisasi", "dev": [["10", "Program executive development yang berfokus pada customer experience strategy dan customer-centric leadership."], ["70", "Keterlibatan langsung dalam penyusunan strategi go-to-market dan customer retention bersama Direksi."], ["70", "Membangun dan memimpin forum internal best practice CS lintas entitas."], ["20", "Menjadi mentor bagi manager dan division head lain dalam membangun kapabilitas customer-centric."]], "kb": ["Membangun hubungan jangka panjang dengan customer kunci sehingga menjadi trusted advisor bagi mereka.", "Menetapkan standar layanan customer yang tinggi di level organisasi dan memastikan standar tersebut dijalankan secara konsisten.", "Mengembangkan strategi untuk meningkatkan customer experience secara berkelanjutan — termasuk inovasi dalam model layanan.", "Menjadi mentor bagi leader lain dalam membangun mindset dan kapabilitas customer-centric di dalam tim mereka."]}]}, {"id": "MC0001", "code": "COM", "nama": "Communication Skill", "jenis": "Managerial", "def": "Kemampuan untuk menyampaikan informasi secara efektif dan efisien, baik secara verbal maupun non-verbal, mencakup kemampuan menyampaikan pesan dengan jelas, mendengarkan secara aktif, dan membangun kepercayaan untuk mencapai tujuan bersama.", "label": "Informasi tidak tersampaikan dengan jelas", "matrix": [2, 3, 4, 4, 5, 5], "lv": [{"lv": 1, "nama": "Awareness", "head": "Menyampaikan Informasi Dasar dengan Jelas", "dev": [["20", "On the job guidance: pendampingan langsung dari atasan saat menyampaikan laporan atau update informasi."], ["70", "Latihan harian menyampaikan update singkat kepada atasan (format: apa yang dikerjakan, hasilnya apa, apa yang akan dilakukan selanjutnya)."], ["10", "Basic training komunikasi kerja: cara menyusun email, pesan singkat, dan update lisan yang efektif."], ["20", "Feedback rutin dari atasan setelah setiap interaksi komunikasi."]], "kb": ["Belum secara konsisten menyampaikan update pekerjaan tanpa diminta — masih perlu diingatkan atau dipancing.", "Menyampaikan pesan sesuai dengan apa yang diketahui tanpa mempertimbangkan apakah cara penyampaiannya sudah tepat.", "Merespons pertanyaan atau instruksi dengan jawaban yang relevan meskipun masih memerlukan panduan dalam beberapa situasi.", "Mendengarkan instruksi sampai selesai sebelum mulai mengerjakan tugas."]}, {"lv": 2, "nama": "Basic", "head": "Menyesuaikan Gaya Komunikasi dengan Lawan Bicara", "dev": [["20", "Coaching dari atasan terkait cara menyesuaikan penyampaian informasi dengan lawan bicara."], ["70", "Penugasan sebagai notulen rapat tim — melatih kemampuan mendengar aktif dan merangkum informasi."], ["70", "Latihan presentasi internal skala kecil (briefing harian, laporan mingguan)."], ["10", "Self-learning terkait etika komunikasi profesional."]], "kb": ["Menyampaikan informasi terkait pekerjaan secara proaktif tanpa harus diminta, dengan cara yang jelas dan tepat waktu.", "Mulai menyesuaikan cara penyampaian informasi dengan menggunakan contoh atau analogi sederhana agar mudah dipahami.", "Menerapkan etika dasar komunikasi (verbal dan tertulis) sesuai standar yang berlaku di organisasi.", "Melakukan konfirmasi ulang kepada atasan/lawan bicara ketika ada instruksi yang kurang dipahami."]}, {"lv": 3, "nama": "Proficient", "head": "Memfasilitasi Komunikasi Dua Arah", "dev": [["10", "Training public speaking dan facilitation skill — fokus pada memimpin diskusi dan mengelola dinamika kelompok ision head lain dalam membangun kapabilitas komunikasi di tim mereka."], ["70", "Evaluasi rutin efektivitas komunikasi organisasi dan penyesuaian strategi."]], "kb": ["Mengembangkan dan mengimplementasikan strategi komunikasi organisasi yang selaras dengan arah dan tujuan perusahaan.", "Mampu mengidentifikasi risiko komunikasi organisasi sebelum berdampak, menyiapkan alternatif pendekatan komunikasi yang tepat.", "Mendorong budaya komunikasi yang transparan dan terbuka di seluruh organisasi melalui keteladanan yang konsisten.", "Mampu memimpin organizational communication pada saat krisis atau perubahan besar dengan dampak terhadap seluruh stakeholder."]}]}, {"id": "MC0002", "code": "LDS", "nama": "Leadership", "jenis": "Managerial", "def": "Seperangkat kemampuan dan karakteristik yang memungkinkan seorang individu untuk mempengaruhi, menggerakkan, dan membimbing orang lain secara efektif sehingga dapat mencapai tujuan bersama dan organisasi.", "label": "Belum bisa mengarahkan tim", "matrix": [0, 2, 3, 3, 4, 5], "lv": [{"lv": 1, "nama": "Awareness", "head": "Menjalankan Peran Leader Ketika Diminta", "dev": [["10", "Training terkait dengan time and task management."], ["20", "Weekly/monthly coaching dengan atasan terkait dengan pencapaian target."], ["70", "Assignment: memberikan tugas/tanggung jawab dalam skala kecil yang dapat dilakukan secara mandiri."]], "kb": ["Memberikan arahan kepada anggota tim ketika situasi mendesak atau ada penugasan formal dari atasan.", "Mengetahui prinsip dasar leadership dan tujuan tim, meskipun belum konsisten menerapkannya.", "Memantau progress kerja anggota tim ketika diminta atau saat ada deadline mendesak.", "Belum proaktif mendeteksi kebutuhan atau kesulitan anggota tim tanpa diminta atasan."]}, {"lv": 2, "nama": "Basic", "head": "Mengambil Inisiatif Memimpin di Lingkup Tugasnya", "dev": [["10", "Workshop terkait dengan self leadership."], ["20", "Menjadi mentor/buddy rekan kerja baru terkait dengan pekerjaannya."], ["70", "Assignment: terlibat di dalam project internal tim untuk melatih ownership."], ["20", "Melakukan sharing knowledge kepada rekan kerja."]], "kb": ["Secara proaktif memberikan arahan atau panduan kepada anggota tim tanpa harus menunggu diminta.", "Memantau kondisi dan kebutuhan anggota tim dan mengambil tindakan ketika ada kendala.", "Membangun kepercayaan anggota tim melalui konsistensi — mengeksekusi apa yang sudah dijanjikan.", "Dapat diandalkan sebagai rujukan pertama anggota tim ketika menghadapi permasalahan dalam pekerjaan.", "Memberikan feedback kepada anggota tim terkait kualitas atau cara kerja mereka."]}, {"lv": 3, "nama": "Proficient", "head": "Menetapkan Arah dan Standar Kerja Tim", "dev": [["10", "Workshop terkait Supervisory Leadership dan Leadership Communication."], ["70", "Melakukan coaching kepada anggota tim terkait dengan pencapaian target."], ["70", "Assignment: menyusun target tim sesuai dengan target departemen/divisi dan action plan pencapaiannya."], ["70", "Assignment: menjadi project leader untuk project internal departemen."]], "kb": ["Mampu mengkomunikasikan target, harapan, dan tujuan dengan jelas dan mudah dipahami oleh semua orang.", "Mendelegasikan tugas sesuai kapabilitas anggota tim dan memantau progress penyelesaiannya secara aktif.", "Memberikan instruksi kerja yang jelas dan memberikan feedback yang konstruktif secara rutin.", "Memberikan guidance kepada anggota tim untuk meningkatkan kinerja atau menghadapi hambatan dalam pekerjaan.", "Mampu beradaptasi dalam perubahan yang terjadi dan membantu tim menyesuaikan diri."]}, {"lv": 4, "nama": "Advanced", "head": "Memimpin Tim Menuju High Performance", "dev": [["10", "Workshop terkait dengan Managerial Leadership."], ["70", "Melakukan coaching kepada anggota tim terkait dengan pencapaian target."], ["70", "Assignment: menyusun target tim sesuai dengan target divisi/corporate dan strategi inisiatifnya."], ["70", "Assignment: terlibat dalam cross function project untuk mendukung strategi ini  insight, bukan hanya data."], ["10", "Training advanced Excel atau tools analisa yang relevan."], ["20", "Coaching dari atasan: review bersama laporan yang sudah dibuat — apakah insight yang disampaikan tepat dan actionable?"], ["20", "Feedback 360 dari rekan kerja dan atasan terkait efektivitas laporan yang dibuat."]], "kb": ["Laporan yang disusun mengandung analisa — bukan hanya data mentah, tapi ada interpretasi tren, perbandingan, atau insight.", "Mampu menyusun laporan dari berbagai sumber data sekaligus dan mengintegrasikannya menjadi satu narasi yang kohesif.", "Mampu menyesuaikan format dan kedalaman laporan sesuai kebutuhan penerima (operasional vs manajerial).", "Rekomendasi atau insight yang disampaikan dalam laporan relevan dan dapat ditindaklanjuti."]}, {"lv": 4, "nama": "Advanced", "head": "Menyusun Laporan Analitis untuk Pengambilan Keputusan", "dev": [["70", "Penugasan menyusun laporan strategis untuk Direksi — termasuk skenario analisis dan rekomendasi yang spesifik."], ["10", "Training advanced analytics: teknik analisa data lanjutan yang relevan dengan konteks bisnis."], ["20", "Coaching eksekutif tentang cara mempresentasikan dan mempertahankan argumentasi laporan."], ["70", "Evaluasi berkala kualitas laporan oleh atasan dan stakeholder penerima."]], "kb": ["Laporan yang disusun secara langsung digunakan oleh manajemen sebagai basis pengambilan keputusan.", "Mampu mengidentifikasi dan mengkomunikasikan risiko atau peluang yang tersembunyi di balik data secara jelas.", "Mampu menyusun proyeksi atau skenario berdasarkan data historis dan kondisi saat ini.", "Rekomendasi yang disampaikan spesifik, terukur, dan disertai dasar analisa yang solid.", "Mampu mempertahankan argumentasi laporan di hadapan Direksi atau stakeholder senior tanpa harus banyak bergantung pada backingan tim."]}, {"lv": 5, "nama": "Expert", "head": "Menetapkan Standar Pelaporan Organisasi", "dev": [["70", "Penugasan merancang framework dan standar pelaporan korporat."], ["70", "Keterlibatan dalam implementasi atau pengembangan sistem pelaporan terintegrasi."], ["20", "Menjadi mentor bagi manager dan supervisor dalam meningkatkan kualitas laporan."], ["70", "Evaluasi berkala efektivitas sistem pelaporan yang dibangun."]], "kb": ["Standar pelaporan yang dirancang diadopsi dan dijalankan secara konsisten oleh seluruh fungsi yang relevan.", "Sistem pelaporan yang dibangun mampu menghasilkan insight strategis secara lebih cepat dan akurat dibandingkan sebelumnya.", "Mampu mengevaluasi efektivitas sistem pelaporan yang berjalan dan melakukan perbaikan berdasarkan kebutuhan bisnis yang berkembang.", "Mampu menjadi mentor bagi manager dan supervisor dalam meningkatkan kualitas laporan di fungsinya masing-masing."]}]}, {"id": "TC0003", "code": "DATA", "nama": "Data Literacy", "jenis": "Technical", "def": "Kemampuan untuk dapat membaca, memahami, membuat, dan mengkomunikasikan data sebagai informasi, mencakup kemampuan bekerja dengan data, menafsirkan, menarik kesimpulan, dan membuat keputusan berbasis data.", "label": "Kesulitan mengolah dan membaca data", "matrix": [2, 2, 3, 3, 4, 4], "lv": [{"lv": 1, "nama": "Awareness", "head": "Membaca Data Sederhana", "dev": [["70", "Latihan membaca berbagai format penyajian data: tabel, grafik batang, grafik garis, pie chart."], ["20", "OJT: dilibatkan dalam proses review laporan rutin bersama atasan — diajak memahami maksud dari setiap angka yang disajikan."], ["20", "Feedback dari atasan setelah setiap tugas yang melibatkan data — apakah interpretasinya sudah benar?"], ["10", "Self-learning dasar Excel atau tools yang digunakan organisasi."]], "kb": ["Mampu membaca tabel, grafik, atau laporan sederhana dan memahami informasi yang disajikan di dalamnya.", "Mampu menjawab pertanyaan dasar berdasarkan data yang sudah tersedia (misalnya: nilai tertinggi, terendah, atau rata-rata).", "Mampu membedakan data yang relevan dengan yang tidak relevan untuk kebutuhan tugas tertentu.", "Tidak salah membaca atau salah menginterpretasikan angka dalam laporan yang sudah tersaji."]}, {"lv": 2, "nama": "Basic", "head": "Mengolah Data Rutin", "dev": [["70", "Penugasan mengolah data rutin secara mandiri (rekap harian, mingguan) — dengan review berkala dari atasan."], ["10", "Training Excel intermediate: fungsi-fungsi dasar yang relevan dengan pekerjaan (VLOOKUP, SUMIF, pivot table dasar)."], ["70", "Latihan data cleaning: diberikan dataset yang mengandung error atau inkonsistensi dan diminta memperbaikinya."], ["10", "Self-learning dasar tentang validasi data."]], "kb": ["Mampu mengumpulkan data dari sumber yang sudah ditentukan dan memasukkannya ke dalam format yang benar.", "Mampu melakukan operasi data dasar secara mandiri: sorting, filtering, perhitungan dasar (sum, average, count).", "Data yang diolah konsisten dan tidak mengandung duplikasi atau inkonsistensi yang tidak terdeteksi.", "Mampu menyajikan data dalam format standar yang mudah dibaca oleh penerima laporan."]}, {"lv": 3, "nama": "Proficient", "head": "Menganalisa Data untuk Temuan", "dev": [["10", "Training analisa data lanjutan: penggunaan fungsi-fungsi Excel yang lebih kompleks, pivot table, atau tools analisa lainnya."], ["70", "Penugasan: analisa satu masalah bisnis menggunakan data dan presentasikan insight kepada atasan atau tim."], ["20", "Coaching dari atasan: review bersama hasil analisa — apakah insight yang ditemukan valid dan relevan?"], ["10", "Self-learning tentang data storytelling."]], "kb": ["Mampu mengidentifikasi tren, pola, atau anomali dalam data secara mandiri.", "Mampu mengintegrasikan data dari berbagai sumber menjadi satu analisa yang kohesif.", "Mampu mengkomunikasikan hasil analisa dalam bahasa yang mudah dipahami oleh audiens non-technical.", "Mampu merancang pendekatan analisa yang sesuai untuk menjawab pertanyaan bisnis yang diberikan."]}, {"lv": 4, "nama": "Advanced", "head": "Mengintegrasikan Data dari Berbagai Sumber untuk Strategic Insight", "dev": [["10", "Training advanced data analytics: penggunaan tools seperti Power BI, Tableau, atau SQL dasar."], ["70", "Penugasan menyusun dashboard atau sistem monitoring berbasis data untuk fungsinya."], ["20", "Coaching eksekutif tentang cara mempresentasikan insight data kepada audiens yang berbeda kebutuhan dan literasi datanya."], ["70", "Evaluasi berkala efektivitas sistem monitoring yang dibangun."]], "kb": ["Mampu merancang pendekatan analisa untuk menjawab pertanyaan bisnis yang kompleks dan ambigu.", "Mampu mengintegrasikan data dari berbagai sumber yang berbeda format dan granularitas untuk menghasilkan insight yang komprehensif.", "Mampu mengkomunikasikan insight dari data kepada audiens yang beragam — termasuk eksekutif dan non-technical stakeholder — dengan cara yang convincing.", "Mampu membangun sistem atau mekanisme monitoring berbasis data yang memungkinkan deteksi masalah lebih awal."]}, {"lv": 5, "nama": "Expert", "head": "Membangun Budaya Data-Driven Decision Making", "dev": [["70", "Keterlibatan langsung dalam desain sistem data dan analitik organisasi."], ["70", "Membangun dan memimpin program peningkatan data literacy di seluruh organisasi."], ["20", "Menjadi mentor bagi manager dan Division Head dalam membangun kemampuan data-driven decision making."], ["20", "Benchmarking dengan organisasi yang sudah mature dalam data analytics."]], "kb": ["Mampu membangun sistem data dan analitik organisasi yang menghasilkan insight strategis secara lebih cepat dan akurat.", "Mengembangkan kapabilitas data literacy tim secara berkelanjutan sehingga data-driven culture menjadi norma.", "Menerapkan budaya penggunaan data sebagai dasar diskusi dan pengambilan keputusan di seluruh organisasi.", "Mampu mengidentifikasi peluang strategis dari data yang tidak terlihat oleh orang lain."]}]}, {"id": "TC0004", "code": "BPM", "nama": "Business Process & Function Mapping", "jenis": "Technical", "def": "Kemampuan untuk memetakan proses bisnis, mengidentifikasi rantai nilai, merumuskan tugas pokok dan fungsi, serta menyusun instrumen pengelolaan peran dan tanggung jawab lintas unit yang mendukung efektivitas dan efisiensi operasional organisasi.", "label": "Proses kerja tidak terdokumentasi", "matrix": [2, 2, 3, 3, 4, 4], "lv": [{"lv": 1, "nama": "Awareness", "head": "Memahami Konsep Proses Bisnis", "dev": [["70", "Onboarding yang mencakup penjelasan SOP dan alur proses kerja di unit masing-masing."], ["70", "Membaca dan mendiskusikan SOP yang berlaku di area kerja bersama atasan langsung."], ["10", "E-learning: Business Process Fundamentals."]], "kb": ["Menjelaskan pengertian proses bisnis dan perbedaan antara proses inti (core) dan proses pendukung (support) dalam konteks organisasi.", "Mengenali elemen dasar sebuah proses: input, aktivitas, output, dan customer proses (internal maupun eksternal).", "Membaca dan memahami flowchart atau process map sederhana yang sudah tersedia, tanpa penjelasan tambahan dari pembuatnya.", "Mengetahui apa itu Tupoksi (Tugas Pokok dan Fungsi) sebagai instrumen pembagian tanggung jawab antar unit kerja."]}, {"lv": 2, "nama": "Basic", "head": "Mendokumentasikan Proses di Lingkup Sendiri", "dev": [["20", "OJT: mendampingi senior dalam proses pemetaan nyata di unitnya."], ["70", "Latihan: membuat process map untuk 1–2 proses paling familiar, lalu review bersama atasan."], ["10", "Tools training: Visio, Lucidchart, atau tools diagram yang tersedia di perusahaan."]], "kb": ["Membuat diagram alir proses bisnis sederhana untuk satu tugas atau fungsi dalam area tanggung jawabnya menggunakan tools yang tersedia.", "Mengisi template Tupoksi untuk unit kerjanya berdasarkan panduan yang diberikan.", "Mengidentifikasi pihak yang terlibat dalam satu proses dan menjelaskan peran masing-masing — siapa yang mengerjakan, menyetujui, dan perlu diinformasikan.", "Menyusun RASCI sederhana untuk proses yang dipetakan di lingkup tugasnya sendiri."]}, {"lv": 3, "nama": "Proficient", "head": "Memetakan dan Menganalisis Proses Mandiri", "dev": [["70", "Penugasan sebagai process mapping lead untuk satu proses bisnis end-to-end di unitnya."], ["10", "Workshop: Value Stream Mapping atau Lean Process Mapping."], ["20", "Kolaborasi dengan OD & Culture Function dalam proyek pemetaan proses."], ["70", "Studi kasus: benchmarking proses bisnis dari perusahaan FMCG sejenis."]], "kb": ["Memetakan seluruh proses bisnis dalam satu unit kerja secara mandiri, termasuk mengidentifikasi titik handover antar peran dan potensi bottleneck.", "Mengidentifikasi inefisiensi, duplikasi aktivitas, atau gap dalam proses yang ada, dan merumuskan rekomendasi perbaikan yang logis dan terukur.", "Menyusun Tupoksi lengkap untuk satu unit kerja yang bebas dari overlap dengan unit lain dan tidak meninggalkan gap tanggung jawab.", "Memimpin proses validasi process map dan Tupoksi bersama anggota tim atau stakeholder yang relevan."]}, {"lv": 4, "nama": "Advanced", "head": "Mengoptimalkan Proses Lintas Fungsi", "dev": [["70", "Project lead dalam proyek transformasi atau reorganisasi yang melibatkan lintas departemen."], ["10", "Training: Business Process Reengineering, Lean Six Sigma minimal Green Belt."], ["70", "Stretch assignment: memimpin cross-functional process mapping project dari nol."], ["20", "Mentoring dengan OD professional atau process improvement specialist internal/eksternal."]], "kb": ["Melakukan pemetaan proses bisnis lintas fungsi dan mengidentifikasi interdependensi antar unit yang berdampak pada efektivitas operasional keseluruhan.", "Menganalisis efektivitas dan efisiensi proses secara sistemik dari perspektif lebih dari satu fungsi — bukan hanya dari sudut pandang sendiri.", "Merumuskan rekomendasi redesign proses yang berdampak lebih dari satu unit kerja, disertai analisis risiko perubahan yang diusulkan.", "Memimpin workshop atau forum lintas departemen untuk validasi dan penyempurnaan pemetaan proses yang kompleks."]}, {"lv": 5, "nama": "Expert", "head": "Membangun Standar Proses Organisasi", "dev": [["10", "Executive education: Enterprise Architecture atau Business Architecture Management."], ["70", "Peran sebagai internal consultant atau lead advisor dalam proyek transformasi berskala besar."], ["20", "Benchmark dengan perusahaan yang sudah mature dalam BPM."], ["20", "Menjadi mentor bagi manager dan supervisor dalam membangun kapabilitas process mapping di tim mereka."]], "kb": ["Mengembangkan standar dan framework pemetaan proses bisnis yang berlaku di seluruh entitas organisasi.", "Mengevaluasi arsitektur proses bisnis organisasi secara keseluruhan dan mengidentifikasi area transformasi yang berdampak strategis.", "Memimpin inisiatif transformasi proses bisnis berskala organisasi yang melibatkan banyak fungsi dan entitas secara bersamaan.", "Membangun kapabilitas business process mapping di seluruh organisasi melalui standarisasi, pelatihan, dan sistem governance yang tepat."]}]}, {"id": "TC0005", "code": "PRO", "nama": "Project Management", "jenis": "Technical", "def": "Kemampuan untuk merencanakan, mengorganisasikan, mengeksekusi, dan mengevaluasi proyek secara sistematis dalam batasan scope, waktu, biaya, dan sumber daya, guna memastikan proyek selesai sesuai target, tepat waktu, dan memberikan nilai bisnis yang diharapkan.", "label": "Proyek atau pekerjaan sering molor", "matrix": [2, 3, 3, 4, 4, 5], "lv": [{"lv": 1, "nama": "Awareness", "head": "Memahami Peran dalam Proyek", "dev": [["20", "Briefing dari project leader sebelum keterlibatan dalam proyek."], ["70", "Penugasan sebagai anggota tim proyek untuk proyek kecil berskala departemen."], ["10", "E-learning: Introduction to Project Management (PMI, Coursera, atau setara)."]], "kb": ["Menjelaskan perbedaan antara pekerjaan rutin (operasional) dan proyek: memiliki start, end, scope, dan deliverable yang spesifik.", "Mengetahui komponen dasar sebuah proyek: scope, timeline, budget, resources, dan deliverable, serta hubungan antar komponen.", "Membaca dan memahami project plan atau Gantt chart sederhana yang diberikan atasan atau project manager.", "Menyelesaikan task yang ditugaskan dalam proyek sesuai instruksi yang diberikan, tepat waktu, dan sesuai spesifikasi."]}, {"lv": 2, "nama": "Basic", "head": "Berkontribusi Aktif dalam Tim Proyek", "dev": [["70", "Penugasan sebagai anggota aktif minimal 2 proyek cross-departmental dalam setahun."], ["20", "Mentoring dari Project Manager yang berpengalaman selama keterlibatan dalam proyek."], ["10", "Tools training: Trello, Asana, MS Project, atau tools manajemen proyek yang digunakan perusahaan."]], "kb": ["Menyusun rencana kerja pribadi dalam konteks proyek yang ditugaskan, mencakup breakdown aktivitas dan estimasi waktu yang realistis.", "Mengidentifikasi dan melaporkan risiko atau hambatan dalam lingkup tugasnya sebelum berdampak pada deliverable proyek.", "Mengkoordinasikan tugasnya dengan anggota tim lain yang berkaitan secara proaktif — tidak menunggu diminta.", "Mendokumentasikan aktivitas dan output kerjanya dalam proyek secara terstruktur sesuai standar yang berlaku."]}, {"lv": 3, "nama": "Proficient", "head": "Memimpin Proyek Berskala Fungsi", "dev": [["70", "Penugasan sebagai Project Manager untuk proyek berskala unit atau departemen."], ["10", "Training: Intermediate Project Management — PMBOK basics, Agile fundamentals."], ["20", "Peer review: evaluasi proyek yang sudah selesai bersama mentor."], ["10", "Sertifikasi: CAPM (Certified Associate in Project Management) atau setara."]], "kb": ["Menyusun project plan lengkap secara mandiri: scope, timeline, resource plan, risk register, dan communication plan untuk proyek dalam lingkup satu fungsi.", "Memimpin tim proyek dan memastikan setiap anggota memahami peran, deliverable, dan timeline-nya masing-masing.", "Memonitor progress proyek secara aktif, mendeteksi deviasi lebih awal, dan mengambil langkah korektif sebelum proyek terdampak signifikan.", "Menyampaikan status proyek kepada stakeholder secara jelas dan terstruktur — termasuk ketika ada masalah, bukan hanya ketika semua berjalan lancar."]}, {"lv": 4, "nama": "Advanced", "head": "Memimpin Proyek Lintas Fungsi yang Kompleks", "dev": [["70", "Penugasan sebagai PM untuk proyek transformasi berskala perusahaan."], ["10", "Sertifikasi: PMP (Project Management Professional) atau Prince2 Practitioner."], ["10", "Training spesifik: Stakeholder Management, Risk Management in Projects."], ["70", "Peer mentoring dari senior PM yang pernah memimpin proyek berskala serupa."]], "kb": ["Memimpin proyek lintas fungsi yang melibatkan banyak stakeholder dengan kepentingan berbeda, dan menjaga alignment seluruh pihak selama implementasi berlangsung.", "Mengelola ketergantungan antar workstream dan mengambil keputusan ketika progress satu bagian terhambat karena ketergantungan pada bagian lain.", "Mengidentifikasi dan memitigasi risiko proyek yang kompleks secara sistematis — termasuk risiko yang bersifat lintas fungsi.", "Mengevaluasi performa proyek secara objektif dan menghasilkan lesson learned yang benar-benar digunakan dalam proyek berikutnya."]}, {"lv": 5, "nama": "Expert", "head": "Membangun Kapabilitas dan Standar Project Management", "dev": [["10", "Program Management atau PMO Leadership program."], ["10", "Executive education: Portfolio Management, Organizational Project Management Maturity."], ["20", "Menjadi mentor bagi PM-PM di seluruh organisasi — bukan hanya memberikan arahan, tetapi memantau progress secara langsung."], ["20", "Benchmark dengan perusahaan yang sudah mature dalam PM capability."]], "kb": ["Membangun metodologi dan governance project management yang berlaku di seluruh organisasi — termasuk standar dokumen, proses review, eskalasi, dan sistem pelaporan proyek.", "Memimpin program (kumpulan proyek yang saling terkait) berskala organisasi dengan dampak strategis jangka panjang.", "Mengidentifikasi proyek dalam portfolio yang kurang berdampak dan merekomendasikan prioritisasi atau penghentian berdasarkan analisis yang objektif.", "Membangun kapabilitas project management di seluruh organisasi melalui coaching, standar, dan sistem yang berjalan mandiri tanpa ketergantungan pada satu orang."]}]}, {"id": "TC0006", "code": "CGM", "nama": "Change Management", "jenis": "Technical", "def": "Kemampuan untuk merencanakan, memfasilitasi, dan mengelola proses perubahan organisasi secara terstruktur — mencakup pemahaman dampak perubahan terhadap individu dan kelompok, pengelolaan resistensi, komunikasi perubahan yang efektif, dan memastikan adopsi perubahan yang berkelanjutan.", "label": "Perubahan diumumkan tapi tidak berjalan", "matrix": [2, 2, 3, 3, 4, 4], "lv": [{"lv": 1, "nama": "Awareness", "head": "Memahami Mengapa Perubahan Terjadi", "dev": [["20", "Sharing session dari leader tentang konteks dan alasan perubahan yang sedang berlangsung."], ["10", "Modul learning: Why Change is Hard — dan Kenapa Tetap Perlu."], ["70", "Keterlibatan sebagai anggota pasif dalam proyek perubahan skala kecil untuk exposure awal."]], "kb": ["Menjelaskan mengapa organisasi perlu berubah dan bagaimana perubahan berdampak pada individu dan tim di sekitarnya.", "Mengetahui bahwa resistensi terhadap perubahan adalah respons yang normal, dan mampu menjelaskan mengapa orang bereaksi berbeda-beda terhadap perubahan.", "Menunjukkan keterbukaan terhadap perubahan yang diinisiasi organisasi — tidak secara aktif menghambat, meskipun perubahan tersebut tidak nyaman secara personal.", "Beradaptasi terhadap perubahan prosedur atau cara kerja baru yang ditetapkan dalam timeline yang wajar."]}, {"lv": 2, "nama": "Basic", "head": "Mendukung Implementasi Perubahan di Lingkup Sendiri", "dev": [["70", "Penugasan sebagai change ambassador untuk perubahan di level unit kerjanya."], ["10", "Training: Change Readiness & Resilience."], ["20", "Coaching dari supervisor: cara memberikan feedback konstruktif terhadap perubahan."]], "kb": ["Mengaplikasikan perubahan prosedur, sistem, atau cara kerja baru secara konsisten di area tanggung jawabnya tanpa perlu selalu diingatkan.", "Menjelaskan kepada rekan kerja di sekitarnya tentang perubahan yang sedang terjadi dan alasan di baliknya, ketika diminta.", "Mengidentifikasi dampak perubahan pada tugas dan rutinitas kerjanya sendiri, dan menyampaikan concern kepada atasan secara konstruktif.", "Menunjukkan konsistensi dalam mengadopsi perubahan bahkan ketika perubahan tersebut menambah beban kerja sementara atau tidak nyaman."]}, {"lv": 3, "nama": "Proficient", "head": "Memfasilitasi Perubahan di Tingkat Tim", "dev": [["70", "Penugasan sebagai change champion dalam proyek perubahan berskala departemen."], ["10", "Training: Change Management Fundamentals — Kotter's 8-Step Model, ADKAR Model."], ["70", "Latihan praktis: membuat stakeholder impact assessment dan communication plan untuk 1 inisiatif perubahan nyata."], ["20", "Mentoring bersama senior manager yang berpengalaman dalam leading change."]], "kb": ["Menganalisis dampak perubahan terhadap tim yang dipimpinnya — mencakup dampak pada proses kerja, peran, dan kemampuan individu yang perlu dikembangkan.", "Menyusun dan mengeksekusi change plan sederhana untuk implementasi perubahan di tingkat tim: komunikasi, training singkat, dan monitoring adopsi.", "Mengidentifikasi dan mengelola sumber-sumber resistensi dalam tim secara proaktif dan konstruktif — dengan memahami dan merespons concern yang mendasarinya.", "Memonitor tingkat adopsi perubahan di timnya dan melakukan intervensi aktif ketika adopsi tidak berjalan sesuai target."]}, {"lv": 4, "nama": "Advanced", "head": "Mengelola Perubahan Lintas Fungsi", "dev": [["10", "Sertifikasi: Prosci ADKAR Certification atau Kotter Change Leadership."], ["70", "Penugasan sebagai Change Lead dalam proyek transformasi berskala perusahaan."], ["10", "Training: Organizational Behavior, Stakeholder Engagement Advanced, Communication Strategy."], ["20", "Coaching dari konsultan eksternal atau senior leader berpengalaman dalam transformasi skala besar."]], "kb": ["Menyusun strategi change management yang komprehensif untuk perubahan berskala lintas fungsi: stakeholder mapping, communication strategy, training plan, dan resistance management plan.", "Mengkoordinasikan implementasi perubahan yang melibatkan banyak pihak dengan kepentingan berbeda, dan menjaga momentum meski ada tekanan dari berbagai arah.", "Mengukur efektivitas implementasi perubahan secara sistematis dan menggunakan data tersebut untuk mengintervensi bagian yang tidak berjalan optimal.", "Mengantisipasi potensi eskalasi resistensi sebelum terjadi dan merancang respons yang tepat sebelum resistensi mengganggu implementasi."]}, {"lv": 5, "nama": "Expert", "head": "Membangun Kapabilitas Perubahan Organisasi", "dev": [["10", "Executive education: Organization Transformation, Culture Change Leadership."], ["70", "Peran sebagai Transformation Director atau Change Lead untuk proyek perubahan strategis besar."], ["20", "Benchmark dengan perusahaan yang berhasil melakukan large-scale transformation."], ["20", "Menjadi mentor bagi leader-leader yang sedang memimpin perubahan di unit mereka."], ["70", "External thought leadership: berbicara dalam forum industri atau menulis tentang pengalaman transformasi."]], "kb": ["Merumuskan strategi perubahan transformasional berskala organisasi yang mencakup perubahan budaya, sistem, dan cara kerja secara bersamaan dan berkesinambungan.", "Membangun kapabilitas change management di seluruh organisasi sehingga perubahan tidak bergantung pada satu atau dua orang ahli, melainkan menjadi kemampuan kolektif yang tersebar.", "Mengukur kesiapan organisasi terhadap perubahan (change readiness) secara sistematis dan merancang intervensi yang tepat sebelum perubahan besar diluncurkan.", "Menjadi trusted advisor bagi Direksi dalam merencanakan perubahan strategis yang berisiko tinggi — pandangannya dicari sebelum keputusan diambil."]}]}];
var CC = (function(){
  var P = {scaleMax:5, ex:0.9, vg:0.75, gd:0.6, av:0.45, achCap:1.2, minScore:1};
  var NORMA = {

function inp(path,val,ph,cls,type){return`<input class="form-control form-control-sm ${cls||""}" ${type?`type="${type}"`:""} data-cp="${path}" value="${H(val)}" placeholder="${H(ph||"")}">`;}

  <tr><td class="lab" rowspan="${ap.length+1}">Action Plan</td><th>Action Item</th><th>PIC</th><th>Deadline</th><th>Status</th><th>Keterangan</th></tr>${ap.map(a=>`<tr class="apr"><td>${H(a.item)}</td><td>${H(a.pic)}</td><td class="c">${a.deadline?fmtD(a.deadline):""}</td><td class="c">${H(a.status)}</td><td>${H(a.ket)}</td></tr>`).join("")}</tbody></table>
  <div class="xs-bot"><table class="xs-t xs-kat"><thead><tr><th colspan="2">Kategori Nilai</th></tr></thead><tbody><tr><td class="k1">90% - 100%</td><td class="c b">Excellent</td></tr><tr><td class="k2">75% - 89%</td><td class="c b">Very Good</td></tr><tr><td class="k3">60% - 74%</td><td class="c b">Good</td></tr><tr><td class="k4">45% - 59%</td><td class="c b">Average</td></tr><tr><td class="k5">0% - 44%</td><td class="c b">Poor</td></tr></tbody></table>
  <table class="xs-t xs-ttd"><thead><tr><th>Karyawan</th><th>Atasan Langsung</th><th>TM</th></tr></thead><tbody><tr class="sp"><td></td><td></td><td></td></tr><tr><td class="c">${H(ss.ttd.k)}</td><td class="c">${H(ss.ttd.a)}</td><td class="c">${H(ss.ttd.tm)}</td></tr></tbody></table></div></div>`;
}
function prevView(D){return`<div class="card-panel no-print"><div class="d-flex flex-wrap gap-2 align-items-center"><span class="small-label mb-0">Tampilkan:</span><button class="btn btn-sm ${CO.prevSess===1?"btn-navy":"btn-outline-navy"}" data-cfp="1">Coaching 1</button><button class="btn btn-sm ${CO.prevSess===2?"btn-navy":"btn-outline-navy"}" data-cfp="2">Coaching 2</button><button class="btn btn-gold btn-sm ms-auto" data-cf="print"><i class="bi bi-printer"></i> Cetak / Simpan PDF</button></div></div><div class="xs-wrap" id="xsPrint">${sheetHTML(D,CO.prevSess)}</div>`;}
function setPath(o,path,val){const p=path.split(".");let x=o;for(let i=0;i<p.length-1;i++)x=x[isNaN(p[i])?p[i]:+p[i]];x[p[p.length-1]]=val;}
function getPath(o,path){return path.split(".").reduce((x,k)=>x==null?x:x[k],o);}
function coachInput(el,commit){
  const D=S.coach,path=el.dataset.cp;if(!D||!path)return;let v=el.value;
  const m=path.match(/^kpi\.(\d+)\.(t1|a1|t2|a2|bobot)$/);
  if(m){const k=D.kpi[+m[1]];v=parseNum(v,m[2]==="bobot"?"%":k.uom);}
  else if(/^w\./.test(path))v=parseNum(v,"%");
  else if(/^(ku|sk)\.\d+\.(p|c1|c2)$/.test(path))v=v===""?"":+v;
  else if(/\.uom$/.test(path)){const i=+path.split(".")[1],k=D.kpi[i];const was=isPctU(k.uom),now=isPctU(v);if(was!==now){["t1","a1","t2","a2"].forEach(f=>{const n=CC.num(k[f]);if(n!==null)k[f]=now?n/100:n*100;});}}
  setPath(D,path,v);CO.dirty=true;
  if(path==="ident.level"){const keep={};D.ku.forEach(k=>keep[k.code]=k);D.ku=CC.kuCodes(v).map(cd=>keep[cd]||{code:cd,name:CC.NORMA[cd].name,p:"",c1:"",c2:""});}
  if(path==="ident.nama"){if(!D.c1.ttd.k||D.c1.ttd.k===CO.lastName)D.c1.ttd.k=v;if(!D.c2.ttd.k||D.c2.ttd.k===CO.lastName)D.c2.ttd.k=v;CO.lastName=v;}
  if(commit)renderCoachKeepScroll();
}
function renderCoachKeepScroll(){const y=window.scrollY;renderCoach();window.scrollTo(0,y);}
document.addEventListener("change",e=>{const el=e.target;if(el.closest&&el.closest("#coachRoot")&&el.dataset.cp)coachInput(el,true);
  if(el.id==="cfEpc"&&el.files[0])readFile(el.files[0]).then(buf=>needXLSX().then(()=>buf)).then(buf=>{try{CO.epc=CoachParse.epcWorkbook(XLSX,buf);CO.epc.file=el.files[0].name;renderEpcPanel();}catch(err){toastC(H(err.message),"err");}});
  if(el.id==="cfForm"&&el.files[0])readFile(el.files[0]).then(buf=>needXLSX().then(()=>buf)).then(buf=>{try{const D=CoachParse.coachingWorkbook(XLSX,buf);if(S.coach&&(S.coach.kpi.length||hasC(S.coach,1))&&!confirm("Isi form saat ini akan diganti dengan isi file yang diupload. Lanjutkan?"))return;
    D.ident.dept=(S.coach&&S.coach.ident.dept)||(S.emp&&S.emp.department)||"";if(!D.ident.nama&&S.emp)D.ident.nama=S.emp.name;S.coach=D;CO.tab="c1";if(S.emp&&nrm(D.ident.nama)!==nrm(S.emp.name))toastC("Perhatian: nama di file ("+H(D.ident.nama)+") berbeda dengan karyawan yang dipilih ("+H(S.emp.name)+").","err");else toastC("Form Coaching berhasil dibaca dari file.","ok");renderCoach();}catch(err){toastC(H(err.message),"err");}});
  if(el.id==="epcB1"||el.id==="epcB2"){CO["epc"+el.id.slice(-2)]=el.value;}
});
document.addEventListener("input",e=>{const el=e.target;if(el.closest&&el.closest("#coachRoot")&&el.dataset.cp&&(el.tagName==="TEXTAREA"||el.type==="text"))coachInput(el,false);if(el.classList&&el.classList.contains("cf-ta")){el.style.height="auto";el.style.height=el.scrollHeight+"px";}});
function renderEpcPanel(){const el=$("#cfEpcPanel");if(!el)return;const E=CO.epc;if(!E){el.innerHTML="";return;}
  const opt=(v)=>[["m0","Bulan 1"],["m1","Bulan 2"],["m2","Bulan 3"],["period","Target periode"]].map(o=>`<option value="${o[0]}" ${v===o[0]?"selected":""}>${o[1]}</option>`).join("");
  CO.epcB1=CO.epcB1||"m0";CO.epcB2=CO.epcB2||"m1";
  el.innerHTML=`<div class="epc-panel mt-3"><div class="d-flex justify-content-between flex-wrap gap-2"><div><div class="fw-semibold"><i class="bi bi-file-earmark-spreadsheet"></i> ${E.generic?"File KPI":"EPC"} terbaca: ${H(E.file)}</div><div class="small text-muted">${H(E.ident.nama)} · ${H(E.ident.posisi)} · ${H(E.ident.dept)} · ${H(E.ident.level)} · Effective Date ${fmtD(E.ident.doj)} · ${E.kpi.length} KPI</div></div><button class="btn btn-sm btn-light" data-cf="epcClose"><i class="bi bi-x-lg"></i></button></div>
  <ol class="small mt-2 mb-2">${E.kpi.map(k=>`<li>${H(k.name)} <span class="text-muted">(${H(k.pol)}, ${H(k.uom)}, bobot ${pct(CC.num(k.bobot))})</span></li>`).join("")}</ol>
  <div class="d-flex flex-wrap gap-3 align-items-end"><label class="small">Target Coaching 1<select class="form-select form-select-sm" id="epcB1">${opt(CO.epcB1)}</select></label><label class="small">Target Coaching 2<select class="form-select form-select-sm" id="epcB2">${opt(CO.epcB2)}</select></label><button class="btn btn-gold btn-sm" data-cf="epcApply"><i class="bi bi-check2"></i> Pakai KPI dari file ini</button></div>
  <div class="small text-muted mt-1">Actual yang sudah diisi tetap dipertahankan bila nama KPI-nya sama.</div></div>`;}
function applyEpc(){const E=CO.epc,D=S.coach;if(!E||!D)return;const pick=(k,w)=>w==="period"?k.period:k.months[+w.slice(1)];
  const old={};D.kpi.forEach(k=>old[nrm(k.name)]=k);
  D.kpi=E.kpi.map(k=>{const o=old[nrm(k.name)]||{};const t1=pick(k,CO.epcB1),t2=pick(k,CO.epcB2);return{name:k.name,pol:k.pol||"Maximize",uom:k.uom||"%",bobot:k.bobot,t1:t1===""||t1==null?(o.t1??""):t1,a1:o.a1??(k.act??""),t2:t2===""||t2==null?(o.t2??""):t2,a2:o.a2??""};});
  const id=D.ident;if(!id.nama)id.nama=E.ident.nama;if(!id.posisi)id.posisi=E.ident.posisi;if(!id.dept)id.dept=E.ident.dept;
  if(E.ident.level&&LEVEL_OPTIONS.includes(E.ident.level)&&E.ident.level!==id.level&&!hasC(D,1)){id.level=E.ident.level;const keep={};D.ku.forEach(k=>keep[k.code]=k);D.ku=CC.kuCodes(id.level).map(cd=>keep[cd]||{code:cd,name:CC.NORMA[cd].name,p:"",c1:"",c2:""});}
  if(S.emp&&E.ident.nama&&nrm(E.ident.nama)!==nrm(S.emp.name))toastC("Perhatian: nama di EPC ("+H(E.ident.nama)+") berbeda dengan karyawan yang dipilih.","err");else toastC("KPI dari EPC sudah dimasukkan ke Desk Review.","ok");
  CO.doj=E.ident.doj;CO.epc=null;CO.dirty=true;renderCoach();}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-cft]");if(t){CO.tab=t.dataset.cft;renderCoach();return;}
  const p=e.target.closest("[data-cfp]");if(p){CO.prevSess=+p.dataset.cfp;renderCoach();return;}
  const a=e.target.closest("[data-cfa]");if(a){const D=S.coach,s=CO.tab==="c2"?2:1;
    if(a.dataset.cfa==="kpi")D.kpi.push({name:"",pol:"Maximize",uom:"%",bobot:"",t1:"",a1:"",t2:"",a2:""});
    if(a.dataset.cfa==="sk")D.sk.push({name:"",p:"",c1:"",c2:""});
    if(a.dataset.cfa==="ap")D["c"+s].ap.push({item:"",pic:"",deadline:"",status:"Open",ket:""});
    if(a.dataset.cfa==="apTool")return apFromTool();
    CO.dirty=true;renderCoachKeepScroll();return;}
  const d=e.target.closest("[data-cfd]");if(d){const p2=d.dataset.cfd.split("."),idx=+p2.pop(),arr=getPath(S.coach,p2.join("."));arr.splice(idx,1);CO.dirty=true;renderCoachKeepScroll();return;}
  const f=e.target.closest("[data-cf]");if(f){const k=f.dataset.cf;
    if(k==="backAdmin")return back();if(k==="xlsx")exportCoach();if(k==="save")saveCoach();if(k==="print"){document.body.classList.add("print-xs");window.print();setTimeout(()=>document.body.classList.remove("print-xs"),500);}
    if(k==="epcClose"){CO.epc=null;renderEpcPanel();}if(k==="epcApply")applyEpc();}
});


  function open(emp,plan,opt){ OPT=opt||{}; OPT.plan=plan||null; CID=OPT.id||("CF-"+Date.now().toString(36).toUpperCase());
    S.emp={name:emp.nama||"",position:emp.posisi||"",department:emp.dept||"",level:emp.level||"Staff",nik:emp.nik||""};
    if(OPT.D) S.coach=JSON.parse(JSON.stringify(OPT.D)); else { var D=CC.blank(S.emp.level); D.ident={nama:S.emp.name,posisi:S.emp.position,level:S.emp.level,dept:S.emp.department,tgl1:todayIso(),tgl2:""}; D.c1.ttd.k=S.emp.name; D.c2.ttd.k=S.emp.name; S.coach=D; }
    CO.tab=hasC(S.coach,1)&&!hasC(S.coach,2)?"c2":"c1"; CO.dirty=false; G.view="coach"; render(); window.scrollTo(0,0); setTimeout(renderCoach,0); }
  return {open:open,render:function(){ setTimeout(renderCoach,0); }};
})();
VIEWS.coach=function(){ COACH.render(); return h('div',{class:'wrap'},h('div',{id:'coachRoot',class:'coachroot'})); };

/* ===== mulai ===== */
(function(){ render(); ST.loadCfg().then(function(){ if(G.view==='home'||G.view==='intro') render(); }); })();
window.addEventListener('beforeunload',function(e){ if(S&&S.dirty&&!S.saved&&(G.view==='plan'||G.view==='cons')){ e.preventDefault(); e.returnValue=''; } });

</script>
